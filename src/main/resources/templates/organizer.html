<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>CampusConnect - Organizer</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6fb}header{background:#1f3a93;color:#fff;padding:16px 32px}header a{color:#fff;margin-right:20px;text-decoration:none;font-weight:bold}main{max-width:820px;margin:28px auto;background:#fff;padding:24px 32px;border-radius:8px;box-shadow:0 1px 4px #0002}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;text-align:left}th{background:#e8edf9}input,select{padding:8px;margin:4px 0 12px;width:100%;box-sizing:border-box}button{background:#1f3a93;color:#fff;border:0;padding:10px 22px;border-radius:4px;cursor:pointer}.ok{color:#17803d;font-weight:bold}.err{color:#b3261e;font-weight:bold}</style></head>
