<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>CampusConnect - Register</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6fb}header{background:#1f3a93;color:#fff;padding:16px 32px}header a{color:#fff;margin-right:20px;text-decoration:none;font-weight:bold}main{max-width:820px;margin:28px auto;background:#fff;padding:24px 32px;border-radius:8px;box-shadow:0 1px 4px #0002}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;text-align:left}th{background:#e8edf9}input,select{padding:8px;margin:4px 0 12px;width:100%;box-sizing:border-box}button{background:#1f3a93;color:#fff;border:0;padding:10px 22px;border-radius:4px;cursor:pointer}.ok{color:#17803d;font-weight:bold}.err{color:#b3261e;font-weight:bold}</style></head>
<body><header><h2 style="margin:0 0 8px">CampusConnect</h2><a href="/">Events</a><a href="/register">Register</a><a href="/organizer">Organizer</a></header><main>
<h2>Event Registration</h2>
<p id="msg" th:if="${msg != null}" th:text="${msg}" th:class="${ok} ? 'ok' : 'err'"></p>
<form method="post" action="/register">
  <label>Name</label><input id="name" name="name" type="text">
  <label>Roll Number</label><input id="rollNo" name="rollNo" type="text">
  <label>Email</label><input id="email" name="email" type="text">
  <label>Event</label>
  <select id="eventId" name="eventId"><option th:each="e : ${events}" th:value="${e.id}" th:text="${e.title}"></option></select>
  <button id="submit" type="submit">Register</button>
</form>
</main></body></html>
